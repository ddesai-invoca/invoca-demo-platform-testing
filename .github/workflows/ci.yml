name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Hard gate — must pass.
      - run: npm run typecheck

      # Informational for now: public/ still has a couple of pre-existing
      # findings (src/screens/AgentWorkflow.tsx, scripts/audit-ai-rules.ts)
      # that predate this workflow. Flip to a hard gate once those are fixed.
      - run: npm run lint
        continue-on-error: true

      # Not run here: `npm run audit` includes audit:voice, which needs the
      # agent/ subproject's own `npm install` (native LiveKit bindings) —
      # out of scope for this workflow. Run it locally before pushing voice
      # agent changes.
